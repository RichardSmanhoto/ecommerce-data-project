version: 2

models:
  - name: int_order_payments
    description: "Payments aggregated to one row per order."
    columns:
      - name: order_id
        tests: [unique, not_null]

  - name: int_order_items
    description: "Order lines aggregated to one row per order."
    columns:
      - name: order_id
        tests: [unique, not_null]

  - name: int_order_reviews
    description: "Latest review per order."
    columns:
      - name: order_id
        tests: [unique, not_null]
