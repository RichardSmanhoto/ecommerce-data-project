version: 2

sources:
  - name: olist_raw
    description: "Raw Olist datasets ingested as local Parquet files."
    meta:
      external_location: "{{ env_var('OLIST_PARQUET_DIR', '../data/parquet') }}/{name}.parquet"
    tables:
      - name: orders
      - name: order_items
      - name: order_payments
      - name: order_reviews
      - name: customers
      - name: products
      - name: sellers
      - name: geolocation
      - name: product_category_translation
